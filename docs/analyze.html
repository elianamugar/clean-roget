<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="favicon.jpg" />
    <link rel="apple-touch-icon" href="favicon.jpg" />
  <meta charset="UTF-8" />
  <title>Analyze Text | Clean Roget</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <a href="index.html">← Back to Home</a>
    <button id="theme-toggle" class="theme-toggle">Toggle dark mode</button>

    <h1>Analyze Text</h1>

    <label for="file-input">Upload a .txt file</label>
    <input id="file-input" type="file" accept=".txt,text/plain" />

    <p>
      Paste text below to generate a Roget-based semantic profile.
    </p>

    <textarea id="text-input" placeholder="Paste text here..."></textarea>

    <label for="pos-filter">Part-of-speech filter</label>
<select id="pos-filter">
  <option value="all">All parts of speech</option>
  <option value="noun">Nouns</option>
  <option value="verb">Verbs</option>
  <option value="adjective">Adjectives</option>
  <option value="adverb">Adverbs</option>
</select>
    <button id="analyze-button">Analyze Text</button>
    <button id="download-button" style="display:none;">
    Download Full Analysis CSV
    </button>
    <section id="results"></section>
    <section class="chart-card analysis-chart" style="display:none;">
        <canvas id="heads-chart"></canvas>
    </section>

    <section class="chart-card analysis-chart" style="display:none;">
        <canvas id="classes-chart"></canvas>
    </section>

    <section class="chart-card analysis-chart" style="display:none;">
        <canvas id="radar-chart"></canvas>
    </section>
  </main>

  <footer class="site-footer">
  <a href="https://elianamugar.com/projects/"
  target="_blank"
  rel="noopener">More Projects</a>
  <span>·</span>

  <a
    href="https://github.com/elianamugar"
    target="_blank"
    rel="noopener"
  >
    GitHub
  </a>

  <span>·</span>

  <a
    href="https://www.elianamugar.com"
    target="_blank"
    rel="noopener"
  >
    elianamugar.com
  </a>
</footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="analyze.js"></script>
  <script src="theme.js"></script>
</body>
</html>
