<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="favicon.jpg" />
    <link rel="apple-touch-icon" href="favicon.jpg" />
  <meta charset="UTF-8" />
  <title>Compare Texts | Clean Roget</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <a href="index.html">← Back to Home</a>
    <button id="theme-toggle" class="theme-toggle">Toggle dark mode</button>

    <h1>Compare Texts or Authors</h1>

    <p>
      Upload or paste two texts to compare their Roget-based semantic profiles.
      For author comparison, upload one representative .txt file for each author.
    </p>

    <section class="compare-grid">
      <div class="compare-panel">
        <h2>Text A</h2>
        <label>Label / Author</label>
        <input id="label-a" type="text" placeholder="e.g. Jane Austen" />

        <label>Upload .txt</label>
        <input id="file-a" type="file" accept=".txt,text/plain" />

        <textarea id="text-a" placeholder="Paste Text A here..."></textarea>
      </div>

      <div class="compare-panel">
        <h2>Text B</h2>
        <label>Label / Author</label>
        <input id="label-b" type="text" placeholder="e.g. Mary Shelley" />

        <label>Upload .txt</label>
        <input id="file-b" type="file" accept=".txt,text/plain" />

        <textarea id="text-b" placeholder="Paste Text B here..."></textarea>
      </div>
    </section>

    <button id="compare-button">Compare Texts</button>

    <section id="comparison-results"></section>

    <section class="chart-card" style="display:none;">
        <canvas id="comparison-heads-chart"></canvas>
    </section>

    <section class="chart-card" style="display:none;">
        <canvas id="comparison-classes-chart"></canvas>
    </section>

    <section class="chart-card" style="display:none;">
        <canvas id="semantic-radar-chart"></canvas>
    </section>

    <section class="chart-card comparison-chart" style="display:none;">
        <canvas id="distinctive-chart"></canvas>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="compare.js"></script>
  <script src="theme.js"></script>
</body>
</html>
