<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="favicon.jpg" />
    <link rel="apple-touch-icon" href="favicon.jpg" />
  <meta charset="UTF-8" />
  <title>Clean Roget Thesaurus Browser</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <a href="index.html">← Back to Home</a>
    <button id="theme-toggle" class="theme-toggle">Toggle dark mode</button>

    <section class="hero">
      <h1>Thesaurus Browser</h1>
      <p class="subtitle">
        Browse the cleaned Roget semantic blocks by class, section, head, and part of speech.
      </p>
    </section>

    <input
      id="search"
      type="search"
      placeholder="Search heads or semantic text..."
    />

    <section id="thesaurus"></section>
  </main>

  <script src="thesaurus.js"></script>
</body>
</html>
